name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Corepack must own the `yarn` shim before setup-node's `cache: yarn`
      # probe runs: the probe calls `yarn --version`, and the runner's global
      # Yarn 1.22 refuses to run in a repo pinning "packageManager": "yarn@4.x".
      # setup-node has no pre-cache hook, so it runs twice -- once to put Node
      # on PATH, then again once Corepack is active and the probe detects Berry.
      # The second call re-uses the Node from the first, so it costs ~a second.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --immutable

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

  e2e:
    name: Cypress e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Corepack must own the `yarn` shim before setup-node's `cache: yarn`
      # probe runs: the probe calls `yarn --version`, and the runner's global
      # Yarn 1.22 refuses to run in a repo pinning "packageManager": "yarn@4.x".
      # setup-node has no pre-cache hook, so it runs twice -- once to put Node
      # on PATH, then again once Corepack is active and the probe detects Berry.
      # The second call re-uses the Node from the first, so it costs ~a second.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --immutable

      # firebase-tools' bundled Firestore emulator requires a JDK 21+ runtime;
      # ubuntu-latest's default `java` on PATH isn't guaranteed to be that new.
      - name: Set up JDK 21 (required by the Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Cache the Firestore emulator JAR that firebase-tools downloads on first
      # use, keyed on its own version so a firebase-tools bump invalidates it.
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Set up env file
        run: cp .env.example .env.local

      - name: Start Firestore emulator
        run: yarn emulators --only firestore &

      - name: Wait for Firestore emulator
        run: npx wait-on tcp:127.0.0.1:8080 --timeout 60000

      # Synthetic fixture (scripts/synthetic-seed-data.json) by default — see
      # "Seeding the Emulator" in README.md. No production credentials needed.
      - name: Seed emulator with synthetic curriculum data
        run: yarn db:seed

      - name: Build
        run: yarn build

      - name: Run Cypress e2e tests
        run: yarn cypress:run

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            cypress/logs
          if-no-files-found: ignore
          retention-days: 7
